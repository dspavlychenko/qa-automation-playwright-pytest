[pytest]
testpaths = tests
# No hard-coded --browser here: pytest-playwright defaults to chromium locally,
# and CI passes --browser <name> explicitly (the option is append-style, so a value
# in addopts would make every CI run execute chromium AND the requested browser).
addopts = -v --strict-markers --alluredir=allure-results
markers =
    ui: UI tests (Playwright)
    api: API tests (requests)
    smoke: critical smoke tests
