name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch/PR cancels the previous run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff
        run: |
          pip install ruff
          ruff check .

  api:
    name: API tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest -m api -n 4 --junitxml=junit-api.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: junit-api.xml

  ui:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('requirements.txt') }}

      # Always run: with a warm cache it only installs the OS libraries and skips the download
      - name: Install Playwright browser
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI tests
        run: >
          pytest -m ui -n 4
          --browser ${{ matrix.browser }}
          --tracing retain-on-failure
          --screenshot only-on-failure
          --video retain-on-failure
          --junitxml=junit-ui-${{ matrix.browser }}.xml

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.browser }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-${{ matrix.browser }}
          path: allure-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: junit-ui-${{ matrix.browser }}.xml

  report:
    name: Allure report
    runs-on: ubuntu-latest
    needs: [api, ui]
    if: always() && github.ref == 'refs/heads/main'
    # Publishing is a bonus: if GitHub Pages is not enabled yet this job must not turn the run red
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout previous reports (history)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Build Allure report
        uses: simple-elf/allure-report-action@v1.12
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history